name: Build Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconsole --onefile --name WindowPosition --icon icon.ico --add-data "icon.ico;." main.py
      - uses: actions/upload-artifact@v4
        with:
          name: WindowPosition-windows
          path: dist/WindowPosition.exe
