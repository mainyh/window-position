name: Build Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconsole --onefile --name WindowPosition --icon icon.ico --add-data "icon.ico;." main.py
      - uses: actions/upload-artifact@v4
        with:
          name: WindowPosition-windows
          path: dist/WindowPosition.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Window Position ${{ github.ref_name }}
          files: dist/WindowPosition.exe
          generate_release_notes: true
